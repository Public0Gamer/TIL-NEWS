name: Build TIL News APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Generate Clean Android Project
      run: |
        rm -rf android_build
        mkdir -p android_build/app/src/main/java/com/todayindialive/news
        mkdir -p android_build/app/src/main/res/layout
        mkdir -p android_build/app/src/main/res/values

        cat << 'EOF' > android_build/settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "TodayIndiaLive"
        include ':app'
        EOF

        cat << 'EOF' > android_build/build.gradle
        plugins {
            id 'com.android.application' version '8.1.4' apply false
        }
        EOF

        cat << 'EOF' > android_build/gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        android.builder.sdkDownload=true
        EOF

        cat << 'EOF' > android_build/app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.todayindialive.news'
            compileSdk 34

            defaultConfig {
                applicationId "com.todayindialive.news"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        }
        EOF

        cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="Today India Live"
                android:supportsRtl="true"
                android:theme="@style/Theme.TILNews"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android_build/app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.TILNews" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="colorPrimary">#E63946</item>
                <item name="colorPrimaryDark">#C62828</item>
                <item name="colorAccent">#E63946</item>
                <item name="android:statusBarColor">#E63946</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > android_build/app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent">

            <ProgressBar
                android:id="@+id/progressBar"
                style="?android:attr/progressBarStyleHorizontal"
                android:layout_width="match_parent"
                android:layout_height="4dp"
                android:layout_alignParentTop="true"
                android:progressTint="#E63946"
                android:visibility="gone" />

            <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                android:id="@+id/swipeRefresh"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:layout_below="@id/progressBar">

                <WebView
                    android:id="@+id/webView"
                    android:layout_width="match_parent"
                    android:layout_height="match_parent" />

            </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
        </RelativeLayout>
        EOF

        cat << 'EOF' > android_build/app/src/main/java/com/todayindialive/news/MainActivity.java
        package com.todayindialive.news;

        import android.os.Bundle;
        import android.view.View;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.ProgressBar;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

        public class MainActivity extends AppCompatActivity {

            private WebView webView;
            private ProgressBar progressBar;
            private SwipeRefreshLayout swipeRefresh;
            private static final String NEWS_URL = "https://public0gamer.github.io/TIL-NEWS/";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                if (getSupportActionBar() != null) {
                    getSupportActionBar().hide();
                }
                setContentView(R.layout.activity_main);

                webView = findViewById(R.id.webView);
                progressBar = findViewById(R.id.progressBar);
                swipeRefresh = findViewById(R.id.swipeRefresh);

                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                settings.setUseWideViewPort(true);
                settings.setLoadWithOverviewMode(true);
                settings.setSupportZoom(false);
                settings.setBuiltInZoomControls(false);
                settings.setAllowFileAccess(true);
                settings.setMediaPlaybackRequiresUserGesture(false);

                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public boolean shouldOverrideUrlLoading(WebView view, String url) {
                        view.loadUrl(url);
                        return true;
                    }
                });

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onProgressChanged(WebView view, int newProgress) {
                        if (newProgress < 100) {
                            progressBar.setVisibility(View.VISIBLE);
                            progressBar.setProgress(newProgress);
                        } else {
                            progressBar.setVisibility(View.GONE);
                        }
                    }
                });

                swipeRefresh.setColorSchemeColors(0xFFE63946);
                swipeRefresh.setOnRefreshListener(() -> {
                    webView.reload();
                    swipeRefresh.setRefreshing(false);
                });

                webView.loadUrl(NEWS_URL);
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    - name: Build Android APK
      run: |
        cd android_build
        gradle assembleDebug --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: TodayIndiaLive-Official-App
        path: android_build/app/build/outputs/apk/debug/app-debug.apk
